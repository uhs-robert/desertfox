# Manual test that AMO unlisted signing works from CI. It publishes and pushes nothing.
# Each signed version burns its number on the add-on id, so use a version the real channel will not use.
name: signing-test

on:
  workflow_dispatch:
    inputs:
      test_version:
        description: Throwaway version to stamp and sign (x.y.z-beta.N)
        required: true
        default: 0.1.23-beta.1

permissions:
  contents: read

jobs:
  sign:
    runs-on: ubuntu-latest
    environment: beta-signing
    timeout-minutes: 20
    env:
      WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
      WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
      TEST_VERSION: ${{ inputs.test_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Stamp the test version in the runner's working copy
        run: |
          if ! [[ "$TEST_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]; then
            echo "test_version must look like 0.1.23-beta.1, got: $TEST_VERSION" >&2
            exit 1
          fi
          jq --arg version "$TEST_VERSION" '.version = $version' src/manifest.json > manifest.tmp
          mv manifest.tmp src/manifest.json
      - name: Build and sign
        run: |
          set -o pipefail
          mkdir -p signing-output
          just sign 2>&1 | tee signing-output/sign.log
      - name: Collect the signed xpi
        if: ${{ !cancelled() }}
        run: |
          mkdir -p signing-output
          cp web-ext-artifacts/*.xpi signing-output/ 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: signing-test-${{ github.run_id }}
          path: signing-output/
          if-no-files-found: warn
