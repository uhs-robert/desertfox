# The which-key panel shows 100 ms after a prefix key, so the cases that wait out the timer sit out 100 ms and not the default 300 ms. p4_whichkey and p3_tab_keys read the panel.
which_key_delay_ms = 100

# Site rules for p19_site_rules. Each pattern names one test page by its id, so no other piece sees a rule.
[[site_rules]]
site = "*://127.0.0.1/page?id=rule_pass*"
pass = "j /"

[[site_rules]]
site = "*://127.0.0.1/frames?id=rule_frames*"  # the cross-origin frame matches on the tab address
pass = "j"

[[site_rules]]
site = "*://127.0.0.1/frame_inner?id=p22_off_same"  # p22_insert_keys: the same-origin frame is all off

[[site_rules]]
site = "*://127.0.0.1/page?id=rule_only*"
only = "G"

[[site_rules]]
site = "*://127.0.0.1/page?id=rule_off*"  # also covers rule_off_switch

[[site_rules]]
site = "*://127.0.0.1/hidden_input_frame?id=rule_off_title_input_shift_moves_focus*"  # the keyup case below

# Each column resolves on its own: off = false keeps rule_keep on under the bare row below, and the pass row between them still applies.
[[site_rules]]
site = "*://127.0.0.1/page?id=rule_keep*"
off = false

[[site_rules]]
site = "*://127.0.0.1/page?id=rule_keep*"
pass = "j"

[[site_rules]]
site = "*://127.0.0.1/page?id=rule_keep*"

# p24_site_zoom: a site row sets the zoom once per host and browser session. Firefox remembers zoom per host, so the piece puts 127.0.0.1 back to 100 percent when it ends.
[[site_rules]]
site = "*://127.0.0.1/page?id=zoom_site*"
zoom = 1.5

# p23_media_keys reads the quality of fake players it expects to start at their own level, so the default max rule stays off there. p26_media_quality_rule tests the rule on its own pages.
[[site_rules]]
site = "*://127.0.0.1/quality?id=p23_quality*"
media_quality = "off"
