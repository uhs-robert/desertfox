// The key test's stand-in for the drop-in loader (Oasis Dots system/usr/lib/firefox/mozilla.cfg), in the private Firefox copy that firefox_copy.mjs makes. Firefox skips this first line.
// It keeps the loader contract: every regular *.js file in GreD/chrome.d that is no symlink and that no group or other can write, in name order, each in its own try, once per browser window after browser-delayed-startup-finished.
// The real loader also skips a file the Firefox user can write. The copy belongs to the test user, so that check would skip every file here.
try {
  const group_other_write = 0o022;
  const load_scripts = (win) => {
    try {
      if (win.location.href !== "chrome://browser/content/browser.xhtml") return;
      const dir = Services.dirsvc.get("GreD", Components.interfaces.nsIFile);
      dir.append("chrome.d");
      if (!dir.exists()) return;
      const files = [];
      for (const entry of dir.directoryEntries) {
        const file = entry.QueryInterface(Components.interfaces.nsIFile);
        if (file.leafName.endsWith(".js") && !file.isSymlink() && file.isFile() && (file.permissions & group_other_write) === 0) files.push(file);
      }
      files.sort((a, b) => (a.leafName < b.leafName ? -1 : a.leafName > b.leafName ? 1 : 0));
      for (const file of files) {
        try {
          Services.scriptloader.loadSubScriptWithOptions(Services.io.newFileURI(file).spec, { target: win, ignoreCache: true, allowUnsafeURL: true });
        } catch (e) {
          Components.utils.reportError(`chrome.d/${file.leafName} failed to load: ${e}`);
        }
      }
    } catch (e) {
      Components.utils.reportError(`chrome.d loader failed: ${e}`);
    }
  };
  Services.obs.addObserver(load_scripts, "browser-delayed-startup-finished");
} catch (e) {
  Components.utils.reportError(`mozilla.cfg failed: ${e}`);
}
