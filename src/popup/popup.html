<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DesertFox</title>
<style>
  html { background: var(--desertfox-bg-core, #0c0e13); color-scheme: dark light; }
  body { margin: 0; }
  /* The defaults sit on an inner element, like every DesertFox surface. The light set is for the first paint, before the theme sheet arrives. */
  .desertfox-popup {
    --desertfox-bg-core: #0c0e13;
    --desertfox-bg-mantle: #151922;
    --desertfox-fg-core: #f5f5dc;
    --desertfox-fg-muted: #9aa0ab;
    --desertfox-border: #2c3240;
    --desertfox-primary: #7fa3c9;
    --desertfox-font: calc(14px * var(--desertfox-font-scale, 1))/1.4 var(--desertfox-font-family, system-ui, sans-serif);
    --desertfox-radius: 8px;
    box-sizing: border-box; width: 18.5rem; padding: .6rem; display: flex; flex-direction: column; gap: .5rem;
    background: var(--desertfox-bg-core, #0c0e13); color: var(--desertfox-fg-core, #f5f5dc); font: var(--desertfox-font);
  }
  @media (prefers-color-scheme: light) {
    .desertfox-popup { --desertfox-bg-core: #fbf8ef; --desertfox-bg-mantle: #f0ebdc; --desertfox-fg-core: #2b2b24; --desertfox-fg-muted: #6a6a5e; --desertfox-border: #cfc8b4; --desertfox-primary: #2f6a9e; }
  }
  .desertfox-popup-header { display: flex; align-items: center; gap: .5em; }
  .desertfox-popup-icon { width: 1.8em; height: 1.8em; }
  .desertfox-popup-wordmark { font-size: 1.25em; font-weight: bold; letter-spacing: .02em; }
  .desertfox-popup-version { margin-left: auto; font-size: .8em; color: var(--desertfox-fg-muted, #9aa0ab); text-decoration: none; }
  .desertfox-popup-version:hover, .desertfox-popup-version:focus-visible { color: var(--desertfox-primary, #7fa3c9); text-decoration: underline; outline: none; }
  .desertfox-popup-host-dot { flex: none; width: .8em; height: .8em; box-sizing: border-box; border: 2px solid var(--desertfox-fg-muted, #9aa0ab); border-radius: 50%; }
  .desertfox-popup-host-dot-up { border-color: var(--desertfox-primary, #7fa3c9); background: var(--desertfox-primary, #7fa3c9); }
  .desertfox-popup-segments { display: flex; margin: 0; min-width: 0; padding: .2em; gap: .2em; border: 1px solid var(--desertfox-border, #2c3240); border-radius: var(--desertfox-radius, 8px); background: var(--desertfox-bg-mantle, #151922); }
  .desertfox-popup-legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  .desertfox-popup-segment { position: relative; flex: 1; display: block; text-align: center; cursor: pointer; }
  .desertfox-popup-segment input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: inherit; }
  .desertfox-popup-segment-text { display: block; padding: .4em 0; border-radius: calc(var(--desertfox-radius, 8px) - 2px); color: var(--desertfox-fg-muted, #9aa0ab); font-weight: bold; }
  .desertfox-popup-segment input:checked + .desertfox-popup-segment-text { background: var(--desertfox-primary, #7fa3c9); color: var(--desertfox-bg-core, #0c0e13); }
  .desertfox-popup-segment input:checked { cursor: default; }
  .desertfox-popup-segment input:not(:checked):hover + .desertfox-popup-segment-text { color: var(--desertfox-fg-core, #f5f5dc); }
  .desertfox-popup-segment input:focus-visible + .desertfox-popup-segment-text { outline: 2px solid var(--desertfox-fg-core, #f5f5dc); outline-offset: 1px; }
  .desertfox-popup-card { display: flex; flex-direction: column; gap: .25em; padding: .6em .7em; border: 1px solid var(--desertfox-border, #2c3240); border-radius: var(--desertfox-radius, 8px); background: var(--desertfox-bg-mantle, #151922); }
  .desertfox-popup-host { font-weight: bold; overflow-wrap: anywhere; }
  .desertfox-popup-state { font-size: .85em; color: var(--desertfox-fg-muted, #9aa0ab); }
  .desertfox-popup-row {
    display: flex; align-items: center; justify-content: space-between; gap: .5em; box-sizing: border-box; width: 100%; padding: .5em .7em;
    border: 1px solid var(--desertfox-border, #2c3240); border-radius: var(--desertfox-radius, 8px); background: none; color: inherit; font: inherit; text-align: left; cursor: pointer;
  }
  .desertfox-popup-row:hover:not(:disabled), .desertfox-popup-row:focus-visible { border-color: var(--desertfox-primary, #7fa3c9); outline: none; }
  .desertfox-popup-row:disabled { opacity: .5; cursor: default; }
  .desertfox-popup-text { display: flex; flex-direction: column; min-width: 0; }
  .desertfox-popup-detail { font-size: .85em; color: var(--desertfox-fg-muted, #9aa0ab); }
  .desertfox-popup-site { margin-top: .35em; }
  .desertfox-popup-site:disabled { border-color: transparent; padding-left: 0; padding-right: 0; opacity: .6; }
  .desertfox-popup-rule { border-style: dashed; }
  .desertfox-popup-theme { display: flex; align-items: center; justify-content: space-between; gap: .5em; padding: 0 .2em; color: var(--desertfox-fg-muted, #9aa0ab); }
  .desertfox-popup-theme-select { min-width: 0; max-width: 11em; padding: .25em .4em; border: 1px solid var(--desertfox-border, #2c3240); border-radius: calc(var(--desertfox-radius, 8px) - 2px); background: var(--desertfox-bg-mantle, #151922); color: var(--desertfox-fg-core, #f5f5dc); font: inherit; }
  .desertfox-popup-theme-select:focus-visible { outline: 2px solid var(--desertfox-primary, #7fa3c9); outline-offset: 1px; }
  .desertfox-popup-link::after { content: ""; flex: none; width: .45em; height: .45em; border: solid var(--desertfox-fg-muted, #9aa0ab); border-width: 2px 2px 0 0; transform: rotate(45deg); }
  .desertfox-popup-row:hover:not(:disabled)::after { border-color: var(--desertfox-primary, #7fa3c9); }
  .desertfox-popup-pages { display: flex; flex-direction: column; gap: .4rem; margin-top: .15rem; padding-top: .6rem; border-top: 1px solid var(--desertfox-border, #2c3240); }
  .desertfox-popup-pair { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .4rem; }
  .desertfox-popup-half { justify-content: safe center; min-width: 0; gap: .3em; padding-left: .2em; padding-right: .2em; font-size: .92em; }
  .desertfox-popup-half .desertfox-popup-text { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .desertfox-popup-glyph { flex: none; width: 1.15em; height: 1.15em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .desertfox-popup-action { justify-content: center; background: var(--desertfox-bg-mantle, #151922); font-weight: bold; }
  .desertfox-popup-action .desertfox-popup-text { align-items: center; }
  .desertfox-popup-support { justify-content: center; margin-top: .15rem; border-style: dashed; color: var(--desertfox-primary, #7fa3c9); }
  .desertfox-popup-support .desertfox-popup-glyph { fill: currentColor; }
  .desertfox-popup-notice:empty { display: none; }
  .desertfox-popup-notice { padding: 0 .2em; font-size: .85em; color: var(--desertfox-fg-muted, #9aa0ab); }
</style>
</head>
<body>
<div class="desertfox-popup" id="desertfox-popup"></div>
<script src="popup.js"></script>
</body>
</html>
