<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DesertFox help</title>
<style>
  html { background: var(--desertfox-bg-core, #0c0e13); color-scheme: dark light; }
  body { margin: 0; }
  /* The defaults sit on an inner element, like every DesertFox surface. */
  .desertfox-help {
    --desertfox-bg-core: #0c0e13;
    --desertfox-fg-core: #f5f5dc;
    --desertfox-primary: #7fa3c9;
    --desertfox-font: 15px/1.5 system-ui, sans-serif;
    --desertfox-radius: 6px;
    display: flex;
    min-height: 100vh;
    background: var(--desertfox-bg-core);
    color: var(--desertfox-fg-core);
    font: var(--desertfox-font);
  }
  .desertfox-help-page { box-sizing: border-box; flex: 1; min-width: 0; max-width: 60rem; padding: 1rem 2rem 4rem; }
  .desertfox-help-sidebar {
    position: sticky; top: 0; align-self: flex-start;
    box-sizing: border-box; flex: none; width: 12rem; height: 100vh; padding: 1rem; overflow-y: auto;
    display: flex; flex-direction: column; gap: .25rem;
    background: color-mix(in srgb, var(--desertfox-fg-core) 6%, var(--desertfox-bg-core));
  }
  .desertfox-help-brand { margin-bottom: .75rem; color: var(--desertfox-primary); font-weight: bold; }
  .desertfox-help-sidebar a { padding: .25rem .5rem; border-radius: var(--desertfox-radius); color: var(--desertfox-fg-core); text-decoration: none; }
  .desertfox-help-sidebar a:hover { background: color-mix(in srgb, var(--desertfox-fg-core) 12%, transparent); }
  .desertfox-help-sidebar a[aria-current="page"] { color: var(--desertfox-primary); background: color-mix(in srgb, var(--desertfox-primary) 15%, transparent); }
  .desertfox-help-nav-row { display: flex; align-items: center; gap: .25rem; }
  .desertfox-help-nav-row a { flex: 1; }
  .desertfox-help-sections-toggle { padding: .25rem .5rem; border: 0; border-radius: var(--desertfox-radius); background: none; color: var(--desertfox-fg-core); font: inherit; cursor: pointer; }
  .desertfox-help-sections-toggle svg { display: block; width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; transition: transform 120ms; }
  .desertfox-help-sections-toggle[aria-expanded="true"] svg { transform: rotate(90deg); }
  @media (prefers-reduced-motion: reduce) { .desertfox-help-sections-toggle svg { transition: none; } }
  .desertfox-help-sections-toggle:hover { background: color-mix(in srgb, var(--desertfox-fg-core) 12%, transparent); }
  .desertfox-help-sections { display: flex; flex-direction: column; margin-left: 1rem; font-size: .9em; }
  .desertfox-help-sections[hidden] { display: none; }
  .desertfox-help-sidebar .desertfox-help-support { display: flex; flex-direction: column; gap: .35rem; margin-top: auto; padding: .6rem .7rem; border: 1px solid var(--desertfox-primary); border-radius: calc(var(--desertfox-radius) * 2); font-size: .85em; }
  .desertfox-help-support-heading { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: .4rem; font-weight: bold; text-align: center; }
  .desertfox-help-support-heart { flex: none; transform-origin: center; width: 1.1em; height: 1.1em; fill: var(--desertfox-primary); }
  .desertfox-help-support:hover .desertfox-help-support-heart { animation: desertfox-help-heart-pulse 400ms ease-out 1; }
  @keyframes desertfox-help-heart-pulse { 50% { transform: scale(1.35); } }
  @media (prefers-reduced-motion: reduce) { .desertfox-help-support:hover .desertfox-help-support-heart { animation: none; } }
  .desertfox-help-support-note { opacity: .7; text-align: center; }
  .desertfox-help-sidebar .desertfox-help-support-link { padding: .25rem .6rem; border: 1px solid var(--desertfox-primary); border-radius: 999px; color: var(--desertfox-primary); text-align: center; }
  .desertfox-help-sidebar .desertfox-help-support-link:hover { background: color-mix(in srgb, var(--desertfox-primary) 15%, transparent); }
  .desertfox-help h1, .desertfox-help h2 { color: var(--desertfox-primary); }
  .desertfox-help h1:focus { outline: none; }
  .desertfox-help h3 { margin: 0 0 .25rem; }
  .desertfox-help-command {
    margin: 1rem 0;
    padding: .75rem 1rem;
    border: 1px solid color-mix(in srgb, var(--desertfox-fg-core) 25%, transparent);
    border-radius: var(--desertfox-radius);
  }
  .desertfox-help-usage, .desertfox-help kbd, .desertfox-help code {
    font-family: ui-monospace, monospace;
  }
  .desertfox-help-usage { margin: .25rem 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  /* The role tokens may not reach this page, so each falls back to the page's own colours. */
  .desertfox-help-code {
    --code-bg: var(--desertfox-bg-mantle, color-mix(in srgb, var(--desertfox-fg-core) 6%, var(--desertfox-bg-core)));
    --code-border: var(--desertfox-border, color-mix(in srgb, var(--desertfox-fg-core) 25%, transparent));
    margin: .75rem 0; background: var(--code-bg); border: 1px solid var(--code-border); border-radius: var(--desertfox-radius);
  }
  .desertfox-help-inline-code {
    padding: .1em .35em; font-size: .9em; border-radius: calc(var(--desertfox-radius) / 2);
    background: var(--desertfox-bg-mantle, color-mix(in srgb, var(--desertfox-fg-core) 6%, var(--desertfox-bg-core)));
    border: 1px solid var(--desertfox-border, color-mix(in srgb, var(--desertfox-fg-core) 25%, transparent));
  }
  .desertfox-help-code-head { display: flex; align-items: center; justify-content: space-between; gap: .5rem; padding: .25rem .5rem .25rem 1rem; min-height: 1.75rem; }
  .desertfox-help-code-lang { font: .8em ui-monospace, monospace; opacity: .6; }
  .desertfox-help-code-copy {
    margin-left: auto; padding: .1rem .6rem; font: .8em system-ui, sans-serif; color: inherit; cursor: pointer;
    background: transparent; border: 1px solid var(--code-border); border-radius: var(--desertfox-radius);
  }
  .desertfox-help-code-copy:hover, .desertfox-help-code-copy:focus-visible { border-color: var(--desertfox-primary); color: var(--desertfox-primary); }
  .desertfox-help-code-body { margin: 0; padding: 0 1rem .75rem; font-family: ui-monospace, monospace; white-space: pre; overflow-x: auto; scrollbar-color: color-mix(in srgb, var(--desertfox-fg-core) 35%, transparent) transparent; }
  .desertfox-help [hidden] { display: none; }
  .desertfox-help kbd { color: var(--desertfox-primary); }
  .desertfox-help-mode { display: inline-block; min-width: 4.5rem; margin-right: .5rem; opacity: .6; }
  .desertfox-help-muted { opacity: .6; }
  .desertfox-help-current { outline: 2px solid var(--desertfox-primary); }
  .desertfox-help-tip {
    margin: 0 0 1rem; padding: .6rem .9rem; border-left: 4px solid var(--desertfox-primary); border-radius: var(--desertfox-radius);
    background: var(--desertfox-bg-mantle, color-mix(in srgb, var(--desertfox-fg-core) 6%, var(--desertfox-bg-core)));
  }
  .desertfox-help-tip-label { color: var(--desertfox-primary); }
  .desertfox-help-warnings { color: var(--desertfox-primary); }
  .desertfox-help table { border-collapse: collapse; margin: .5rem 0; }
  .desertfox-help-params { width: 100%; }
  .desertfox-help-engines { width: 100%; table-layout: fixed; overflow-wrap: anywhere; }
  .desertfox-help-engines th:nth-child(1) { width: 24%; }
  .desertfox-help-engines th:nth-child(2) { width: 28%; }
  .desertfox-help-engines th:nth-child(3) { width: 20%; }
  .desertfox-help-engines summary { cursor: pointer; }
  .desertfox-help-badge { display: inline-block; padding: 0 .4rem; border-radius: var(--desertfox-radius); font-size: .8em; background: color-mix(in srgb, var(--desertfox-fg-core) 15%, transparent); }
  .desertfox-help th, .desertfox-help td { padding: .1rem 1rem .1rem 0; text-align: left; vertical-align: top; }
  .desertfox-help-params td:nth-child(n+4) { overflow-wrap: anywhere; }
  /* Narrow screens: five columns leave each one a few letters wide, so each param stacks as labelled lines. */
  @media (max-width: 40rem) {
    .desertfox-help { flex-direction: column; }
    .desertfox-help-sidebar { position: static; width: auto; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; }
    .desertfox-help-sidebar .desertfox-help-support { margin-top: 0; }
    /* The group dissolves so the list can take its own full-width line inside the wrapping row. */
    .desertfox-help-nav-group { display: contents; }
    .desertfox-help-sections { flex-basis: 100%; flex-direction: row; flex-wrap: wrap; margin-left: 0; }
    .desertfox-help-brand { margin: 0 .5rem 0 0; }
    .desertfox-help-page { padding: 1rem; }
    .desertfox-help-params, .desertfox-help-params tr, .desertfox-help-params td { display: block; }
    .desertfox-help-params td { overflow-wrap: anywhere; }
    /* Visually hidden, not display:none, so screen readers keep the column headers. */
    .desertfox-help-params tr:first-child { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    .desertfox-help-params tr { margin: .5rem 0; }
    .desertfox-help-params td:empty { display: none; }
    .desertfox-help-params td::before { opacity: .6; margin-right: .5rem; }
    .desertfox-help-params td:nth-child(1)::before { content: "param"; }
    .desertfox-help-params td:nth-child(2)::before { content: "type"; }
    .desertfox-help-params td:nth-child(3)::before { content: "default"; }
    .desertfox-help-params td:nth-child(4)::before { content: "values"; }
    .desertfox-help-params td:nth-child(5)::before { content: "flags"; }
  }
</style>
</head>
<body><script src="help.js"></script>
<!-- moz-extension:// pages do not match <all_urls>, so keys on this page need the content script by tag. -->
<script src="content.js"></script>
<script src="ui.js"></script>
<!-- Hints, which-key, the command line and caret mode (which also holds page search) cannot load on request here, so the Quick Start keys need them by tag. -->
<script src="hints.js"></script>
<script src="whichkey.js"></script>
<script src="cmdline.js"></script>
<script src="caret.js"></script></body>
</html>
