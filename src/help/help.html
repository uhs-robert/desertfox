<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OasisFox help</title>
<style>
  body { margin: 0; }
  /* The defaults sit on an inner element, like every OasisFox surface. */
  .oasisfox-help {
    --oasisfox-bg: #0c0e13;
    --oasisfox-fg: #f5f5dc;
    --oasisfox-accent: #7fa3c9;
    --oasisfox-font: 15px/1.5 system-ui, sans-serif;
    --oasisfox-radius: 6px;
    display: flex;
    min-height: 100vh;
    background: var(--oasisfox-bg);
    color: var(--oasisfox-fg);
    font: var(--oasisfox-font);
  }
  .oasisfox-help-page { box-sizing: border-box; flex: 1; min-width: 0; max-width: 60rem; padding: 1rem 2rem 4rem; }
  .oasisfox-help-sidebar {
    position: sticky; top: 0; align-self: flex-start;
    box-sizing: border-box; flex: none; width: 12rem; height: 100vh; padding: 1rem;
    display: flex; flex-direction: column; gap: .25rem;
    background: color-mix(in srgb, var(--oasisfox-fg) 6%, var(--oasisfox-bg));
  }
  .oasisfox-help-brand { margin-bottom: .75rem; color: var(--oasisfox-accent); font-weight: bold; }
  .oasisfox-help-sidebar a { padding: .25rem .5rem; border-radius: var(--oasisfox-radius); color: var(--oasisfox-fg); text-decoration: none; }
  .oasisfox-help-sidebar a:hover { background: color-mix(in srgb, var(--oasisfox-fg) 12%, transparent); }
  .oasisfox-help-sidebar a[aria-current="page"] { color: var(--oasisfox-accent); background: color-mix(in srgb, var(--oasisfox-accent) 15%, transparent); }
  .oasisfox-help h1, .oasisfox-help h2 { color: var(--oasisfox-accent); }
  .oasisfox-help h1:focus { outline: none; }
  .oasisfox-help h3 { margin: 0 0 .25rem; }
  .oasisfox-help-command {
    margin: 1rem 0;
    padding: .75rem 1rem;
    border: 1px solid color-mix(in srgb, var(--oasisfox-fg) 25%, transparent);
    border-radius: var(--oasisfox-radius);
  }
  .oasisfox-help-usage, .oasisfox-help kbd, .oasisfox-help code {
    font-family: ui-monospace, monospace;
  }
  .oasisfox-help-usage { margin: .25rem 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .oasisfox-help kbd { color: var(--oasisfox-accent); }
  .oasisfox-help-mode { display: inline-block; min-width: 4.5rem; margin-right: .5rem; opacity: .6; }
  .oasisfox-help-muted { opacity: .6; }
  .oasisfox-help-current { outline: 2px solid var(--oasisfox-accent); }
  .oasisfox-help-warnings { color: var(--oasisfox-accent); }
  .oasisfox-help table { border-collapse: collapse; margin: .5rem 0; }
  .oasisfox-help-params { width: 100%; }
  .oasisfox-help-engines { display: block; max-width: 100%; overflow-x: auto; }
  .oasisfox-help th, .oasisfox-help td { padding: .1rem 1rem .1rem 0; text-align: left; vertical-align: top; }
  .oasisfox-help-params td:nth-child(n+4) { overflow-wrap: anywhere; }
  /* Narrow screens: five columns leave each one a few letters wide, so each param stacks as labelled lines. */
  @media (max-width: 40rem) {
    .oasisfox-help { flex-direction: column; }
    .oasisfox-help-sidebar { position: static; width: auto; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; }
    .oasisfox-help-brand { margin: 0 .5rem 0 0; }
    .oasisfox-help-page { padding: 1rem; }
    .oasisfox-help-params, .oasisfox-help-params tr, .oasisfox-help-params td { display: block; }
    .oasisfox-help-params td { overflow-wrap: anywhere; }
    /* Visually hidden, not display:none, so screen readers keep the column headers. */
    .oasisfox-help-params tr:first-child { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    .oasisfox-help-params tr { margin: .5rem 0; }
    .oasisfox-help-params td:empty { display: none; }
    .oasisfox-help-params td::before { opacity: .6; margin-right: .5rem; }
    .oasisfox-help-params td:nth-child(1)::before { content: "param"; }
    .oasisfox-help-params td:nth-child(2)::before { content: "type"; }
    .oasisfox-help-params td:nth-child(3)::before { content: "default"; }
    .oasisfox-help-params td:nth-child(4)::before { content: "values"; }
    .oasisfox-help-params td:nth-child(5)::before { content: "flags"; }
  }
</style>
</head>
<body><script src="help.js"></script>
<!-- moz-extension:// pages do not match <all_urls>, so keys on this page need the content script by tag. -->
<script src="content.js"></script>
<script src="ui.js"></script></body>
</html>
