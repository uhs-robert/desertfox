<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DesertFox</title>
<style>
  html { background: var(--desertfox-bg-core, #0c0e13); color-scheme: dark light; }
  body { margin: 0; }
  /* The defaults sit on an inner element, like every DesertFox surface. */
  .desertfox-help {
    --desertfox-bg-core: #0c0e13;
    --desertfox-fg-core: #f5f5dc;
    --desertfox-primary: #7fa3c9;
    --desertfox-font: 15px/1.5 system-ui, sans-serif;
    --desertfox-radius: 6px;
    display: flex;
    min-height: 100vh;
    background: var(--desertfox-bg-core);
    color: var(--desertfox-fg-core);
    font: var(--desertfox-font);
  }
  .desertfox-help-page { box-sizing: border-box; flex: 1; min-width: 0; max-width: 60rem; padding: 1rem 2rem 4rem; }
  .desertfox-help-sidebar {
    position: sticky; top: 0; align-self: flex-start;
    box-sizing: border-box; flex: none; width: 12rem; height: 100vh; padding: 1rem; overflow-y: auto;
    display: flex; flex-direction: column; gap: .25rem;
    background: color-mix(in srgb, var(--desertfox-fg-core) 6%, var(--desertfox-bg-core));
  }
  .desertfox-help-brand { display: flex; align-items: center; gap: .5rem; margin-bottom: .75rem; color: var(--desertfox-primary); font-weight: bold; }
  .desertfox-help-home-header { display: flex; flex-direction: column; align-items: center; margin-bottom: 2rem; text-align: center; }
  .desertfox-help-keycap { display: block; width: 7rem; height: 7rem; margin-bottom: 1rem; }
  .desertfox-help-logo { width: 1.75rem; height: 1.75rem; }
  /* The menu bar and the backdrop exist only for the narrow drawer. */
  .desertfox-help-topbar, .desertfox-help-backdrop { display: none; }
  .desertfox-help-menu-toggle { padding: .4rem; border: 0; border-radius: var(--desertfox-radius); background: none; color: var(--desertfox-fg-core); cursor: pointer; }
  .desertfox-help-menu-toggle:hover { background: color-mix(in srgb, var(--desertfox-fg-core) 12%, transparent); }
  .desertfox-help-menu-toggle svg { display: block; width: 1.25rem; height: 1.25rem; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; }
  .desertfox-help-sidebar a { padding: .25rem .5rem; border-radius: var(--desertfox-radius); color: var(--desertfox-fg-core); text-decoration: none; }
  .desertfox-help-sidebar a:hover { background: color-mix(in srgb, var(--desertfox-fg-core) 12%, transparent); }
  .desertfox-help-sidebar a[aria-current="page"] { color: var(--desertfox-primary); background: color-mix(in srgb, var(--desertfox-primary) 15%, transparent); }
  .desertfox-help-nav-row { display: flex; align-items: center; gap: .25rem; }
  .desertfox-help-nav-row a { flex: 1; }
  .desertfox-help-sections-toggle { padding: .25rem .5rem; border: 0; border-radius: var(--desertfox-radius); background: none; color: var(--desertfox-fg-core); font: inherit; cursor: pointer; }
  .desertfox-help-sections-toggle svg { display: block; width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; transition: transform 120ms; }
  .desertfox-help-sections-toggle[aria-expanded="true"] svg { transform: rotate(90deg); }
  @media (prefers-reduced-motion: reduce) { .desertfox-help-sections-toggle svg { transition: none; } }
  .desertfox-help-sections-toggle:hover { background: color-mix(in srgb, var(--desertfox-fg-core) 12%, transparent); }
  .desertfox-help-sections { display: flex; flex-direction: column; margin-left: 1rem; font-size: .9em; }
  .desertfox-help-sections[hidden] { display: none; }
  .desertfox-help-sidebar .desertfox-help-support { display: flex; flex-direction: column; gap: .35rem; margin-top: auto; padding: .6rem .7rem; border: 1px solid var(--desertfox-primary); border-radius: calc(var(--desertfox-radius) * 2); font-size: .85em; }
  .desertfox-help-support-heading { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: .4rem; font-weight: bold; text-align: center; }
  .desertfox-help-support-heart { flex: none; transform-origin: center; width: 1.1em; height: 1.1em; fill: var(--desertfox-primary); }
  .desertfox-help-support:hover .desertfox-help-support-heart { animation: desertfox-help-heart-pulse 400ms ease-out 1; }
  @keyframes desertfox-help-heart-pulse { 50% { transform: scale(1.35); } }
  @media (prefers-reduced-motion: reduce) { .desertfox-help-support:hover .desertfox-help-support-heart { animation: none; } }
  .desertfox-help-support-note { opacity: .7; text-align: center; }
  .desertfox-help-sidebar .desertfox-help-support-link { padding: .25rem .6rem; border: 1px solid var(--desertfox-primary); border-radius: 999px; color: var(--desertfox-primary); text-align: center; }
  .desertfox-help-sidebar .desertfox-help-support-link:hover { background: color-mix(in srgb, var(--desertfox-primary) 15%, transparent); }
  .desertfox-help h1, .desertfox-help h2 { color: var(--desertfox-primary); }
  .desertfox-help h1:focus { outline: none; }
  .desertfox-help h3 { margin: 0 0 .25rem; }
  .desertfox-help-command {
    margin: 1rem 0;
    padding: .75rem 1rem;
    border: 1px solid color-mix(in srgb, var(--desertfox-fg-core) 25%, transparent);
    border-radius: var(--desertfox-radius);
  }
  .desertfox-help-usage, .desertfox-help kbd, .desertfox-help code {
    font-family: ui-monospace, monospace;
  }
  .desertfox-help-usage { margin: .25rem 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  /* The role tokens may not reach this page, so each falls back to the page's own colours. */
  .desertfox-help-code {
    --code-bg: var(--desertfox-bg-mantle, color-mix(in srgb, var(--desertfox-fg-core) 6%, var(--desertfox-bg-core)));
    --code-border: var(--desertfox-border, color-mix(in srgb, var(--desertfox-fg-core) 25%, transparent));
    margin: .75rem 0; background: var(--code-bg); border: 1px solid var(--code-border); border-radius: var(--desertfox-radius);
  }
  .desertfox-help-inline-code {
    padding: .1em .35em; font-size: .9em; border-radius: calc(var(--desertfox-radius) / 2);
    background: var(--desertfox-bg-mantle, color-mix(in srgb, var(--desertfox-fg-core) 6%, var(--desertfox-bg-core)));
    border: 1px solid var(--desertfox-border, color-mix(in srgb, var(--desertfox-fg-core) 25%, transparent));
  }
  .desertfox-help-code-head { display: flex; align-items: center; justify-content: space-between; gap: .5rem; padding: .25rem .5rem .25rem 1rem; min-height: 1.75rem; }
  .desertfox-help-code-lang { font: .8em ui-monospace, monospace; opacity: .6; }
  .desertfox-help-code-copy {
    margin-left: auto; padding: .1rem .6rem; font: .8em system-ui, sans-serif; color: inherit; cursor: pointer;
    background: transparent; border: 1px solid var(--code-border); border-radius: var(--desertfox-radius);
  }
  .desertfox-help-code-copy:hover, .desertfox-help-code-copy:focus-visible { border-color: var(--desertfox-primary); color: var(--desertfox-primary); }
  .desertfox-help-advanced-toggle {
    padding: .25rem .8rem; font: inherit; color: inherit; cursor: pointer;
    background: transparent; border: 1px solid color-mix(in srgb, var(--desertfox-fg-core) 25%, transparent); border-radius: var(--desertfox-radius);
  }
  .desertfox-help-advanced-toggle:hover, .desertfox-help-advanced-toggle:focus-visible { border-color: var(--desertfox-primary); color: var(--desertfox-primary); }
  .desertfox-help-code-body { margin: 0; padding: 0 1rem .75rem; font-family: ui-monospace, monospace; white-space: pre; overflow-x: auto; scrollbar-color: color-mix(in srgb, var(--desertfox-fg-core) 35%, transparent) transparent; }
  .desertfox-help [hidden] { display: none; }
  .desertfox-help kbd { color: var(--desertfox-primary); }
  .desertfox-help-mode { display: inline-block; min-width: 4.5rem; margin-right: .5rem; opacity: .6; }
  .desertfox-help-muted { opacity: .6; }
  .desertfox-help-shadowed { opacity: .5; }
  .desertfox-help-current { outline: 2px solid var(--desertfox-primary); }
  .desertfox-help-tip {
    margin: 0 0 1rem; padding: .6rem .9rem; border-left: 4px solid var(--desertfox-primary); border-radius: var(--desertfox-radius);
    background: var(--desertfox-bg-mantle, color-mix(in srgb, var(--desertfox-fg-core) 6%, var(--desertfox-bg-core)));
  }
  .desertfox-help-tip-label { color: var(--desertfox-primary); }
  .desertfox-help-warnings { color: var(--desertfox-primary); }
  .desertfox-help table { border-collapse: collapse; margin: .5rem 0; }
  .desertfox-help-params, .desertfox-help-site-rules { width: 100%; }
  .desertfox-help-engines { width: 100%; table-layout: fixed; overflow-wrap: anywhere; }
  .desertfox-help-engines th:nth-child(1) { width: 24%; }
  .desertfox-help-engines th:nth-child(2) { width: 28%; }
  .desertfox-help-engines th:nth-child(3) { width: 20%; }
  .desertfox-help-engines summary { cursor: pointer; }
  .desertfox-help-badge { display: inline-block; padding: 0 .4rem; border-radius: var(--desertfox-radius); font-size: .8em; background: color-mix(in srgb, var(--desertfox-fg-core) 15%, transparent); }
  .desertfox-help th, .desertfox-help td { padding: .1rem 1rem .1rem 0; text-align: left; vertical-align: top; }
  .desertfox-help-params td:nth-child(n+4) { overflow-wrap: anywhere; }
  /* overflow-wrap: anywhere lowers the cell's minimum width, so a long URL wraps and the tag column stays on screen. */
  .desertfox-settings-row { display: flex; flex-direction: column; gap: .25rem; padding: .6rem 0; border-bottom: 1px solid color-mix(in srgb, var(--desertfox-fg-core) 15%, transparent); }
  .desertfox-settings-head { display: flex; align-items: center; gap: .5rem; }
  .desertfox-settings-doc { margin: 0; }
  .desertfox-settings-more > summary { cursor: pointer; font-size: .85em; }
  .desertfox-settings-more > p { margin: .25rem 0 0; }
  /* The changed-only filter: render.ts sets the class on the settings box and settings_page.ts sets data-changed on each row. */
  .desertfox-settings-none-changed { display: none; }
  .desertfox-only-changed .desertfox-settings-row[data-changed="false"] { display: none; }
  .desertfox-only-changed .desertfox-settings-section:not(:has(.desertfox-settings-row[data-changed="true"])) { display: none; }
  .desertfox-only-changed:not(:has(.desertfox-settings-row[data-changed="true"])) .desertfox-settings-none-changed { display: block; }
  .desertfox-settings-advanced { margin-top: 1.5rem; }
  /* The last section sits near the page end, so the room below lets a section link scroll it to the top. A closed block adds no room. */
  .desertfox-settings-advanced[open] { padding-bottom: 50vh; }
  .desertfox-settings-advanced > summary { cursor: pointer; font-weight: bold; font-size: 1.2em; }
  .desertfox-settings-body { display: flex; flex-wrap: wrap; align-items: flex-start; gap: .5rem; }
  .desertfox-settings-input { max-width: 100%; box-sizing: border-box; padding: .25rem .4rem; border: 1px solid color-mix(in srgb, var(--desertfox-fg-core) 40%, transparent); border-radius: var(--desertfox-radius); background: var(--desertfox-bg-core); color: var(--desertfox-fg-core); font: inherit; }
  .desertfox-settings-input[aria-invalid="true"] { border-color: var(--desertfox-primary); }
  .desertfox-settings-install, .desertfox-settings-reset, .desertfox-settings-move { padding: .15rem .6rem; border: 1px solid color-mix(in srgb, var(--desertfox-fg-core) 40%, transparent); border-radius: var(--desertfox-radius); background: none; color: var(--desertfox-fg-core); font: inherit; cursor: pointer; }
  .desertfox-settings-reset:disabled, .desertfox-settings-move:disabled { opacity: .4; cursor: default; }
  .desertfox-settings-order-row { display: flex; align-items: center; gap: .4rem; margin-bottom: .2rem; }
  .desertfox-settings-links .desertfox-settings-order-row { flex-wrap: wrap; }
  .desertfox-transfer-input { display: none; }
  .desertfox-transfer-installed.desertfox-files-row { flex-direction: row; align-items: center; gap: .5rem; }
  .desertfox-files-text { width: 100%; box-sizing: border-box; font-family: monospace; }
  .desertfox-transfer-snippet, .desertfox-transfer-installed { display: flex; flex-direction: column; gap: .25rem; padding: .6rem 0; border-bottom: 1px solid color-mix(in srgb, var(--desertfox-fg-core) 15%, transparent); }
  .desertfox-transfer-code { max-height: 16rem; overflow: auto; margin: 0; padding: .5rem; border-radius: var(--desertfox-radius); background: color-mix(in srgb, var(--desertfox-fg-core) 8%, var(--desertfox-bg-core)); white-space: pre-wrap; }
  .desertfox-transfer-warning { color: var(--desertfox-primary); font-weight: bold; }
  .desertfox-settings-message:empty { display: none; }
  .desertfox-host-start:not(:empty) { margin-bottom: 1rem; padding: 0 1rem .75rem; border: 1px solid var(--desertfox-primary); border-radius: var(--desertfox-radius); }
  .desertfox-settings-error { color: var(--desertfox-primary); }
  .desertfox-keys-tools { margin-bottom: .5rem; }
  .desertfox-engines-form { display: flex; flex-wrap: wrap; gap: .5rem; align-items: flex-end; margin-bottom: .4rem; }
  .desertfox-engines-field { display: flex; flex-direction: column; gap: .2rem; }
  .desertfox-keys-mode h3 { display: inline-block; margin-right: .5rem; }
  .desertfox-keys-table { width: 100%; }
  .desertfox-keys-row { cursor: pointer; }
  .desertfox-keys-row:hover { background: color-mix(in srgb, var(--desertfox-fg-core) 8%, transparent); }
  .desertfox-keys-editor-cell { padding: .5rem .6rem; border: 1px solid var(--desertfox-primary); border-radius: var(--desertfox-radius); }
  .desertfox-keys-editor-line { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; margin-bottom: .4rem; }
  .desertfox-keys-capture { min-width: 12rem; min-height: 1.6rem; cursor: text; }
  .desertfox-keys-capture:focus { outline: 2px solid var(--desertfox-primary); }
  .desertfox-keys-capture kbd { margin-right: .3rem; }
  .desertfox-keys-command { min-width: 20rem; flex: 1; }
  /* Narrow screens: the sidebar becomes a drawer that slides over the page from the left, opened by the menu button in a bar that stays on top. */
  @media (max-width: 40rem) {
    html { scroll-padding-top: 3.5rem; }
    html:has(.desertfox-help-drawer-open) { overflow: hidden; }
    .desertfox-help { flex-direction: column; }
    .desertfox-help-topbar {
      position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: .5rem; padding: .4rem 1rem;
      background: color-mix(in srgb, var(--desertfox-fg-core) 6%, var(--desertfox-bg-core));
    }
    .desertfox-help-topbar .desertfox-help-brand { margin: 0; }
    /* Hidden by visibility, not display, so the slide can run. Hidden content stays out of the tab order and away from hints.
       Visibility waits out the slide only on close. On open it turns at once, because the open click focuses a link inside. */
    .desertfox-help-sidebar {
      position: fixed; top: 0; bottom: 0; left: 0; z-index: 3; align-self: stretch; width: min(16rem, 85vw); height: auto;
      visibility: hidden; transform: translateX(-100%); transition: transform 150ms ease-out, visibility 0s 150ms;
      box-shadow: 0 0 1.5rem color-mix(in srgb, var(--desertfox-bg-core) 70%, transparent);
    }
    .desertfox-help-drawer-open .desertfox-help-sidebar { visibility: visible; transform: none; transition: transform 150ms ease-out; }
    .desertfox-help-drawer-open .desertfox-help-backdrop { position: fixed; inset: 0; z-index: 2; display: block; background: color-mix(in srgb, var(--desertfox-bg-core) 60%, transparent); }
    .desertfox-help-page { padding: 1rem; }
    /* Five param columns leave each one a few letters wide, so each param stacks as labelled lines. */
    .desertfox-help-params, .desertfox-help-params tr, .desertfox-help-params td, .desertfox-help-site-rules, .desertfox-help-site-rules tr, .desertfox-help-site-rules td { display: block; }
    .desertfox-help-site-rules td { overflow-wrap: anywhere; }
    .desertfox-help-site-rules tr:first-child { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    .desertfox-help-site-rules tr { margin: .5rem 0; }
    .desertfox-help-site-rules td:empty { display: none; }
    .desertfox-help-site-rules td::before { opacity: .6; margin-right: .5rem; }
    .desertfox-help-columns td:nth-child(1)::before { content: "option"; }
    .desertfox-help-columns td:nth-child(2)::before { content: "value"; }
    .desertfox-help-changes td:nth-child(1)::before { content: "key"; }
    .desertfox-help-changes td:nth-child(2)::before { content: "mode"; }
    .desertfox-help-changes td:nth-child(3)::before { content: "does"; }
    .desertfox-help-changes td:nth-child(4)::before { content: "was"; }
    .desertfox-help-params td { overflow-wrap: anywhere; }
    /* Visually hidden, not display:none, so screen readers keep the column headers. */
    .desertfox-help-params tr:first-child { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    .desertfox-help-params tr { margin: .5rem 0; }
    .desertfox-help-params td:empty { display: none; }
    .desertfox-help-params td::before { opacity: .6; margin-right: .5rem; }
    .desertfox-help-params td:nth-child(1)::before { content: "option"; }
    .desertfox-help-params td:nth-child(2)::before { content: "type"; }
    .desertfox-help-params td:nth-child(3)::before { content: "default"; }
    .desertfox-help-params td:nth-child(4)::before { content: "values"; }
    .desertfox-help-params td:nth-child(5)::before { content: "flags"; }
  }
  @media (max-width: 40rem) and (prefers-reduced-motion: reduce) { .desertfox-help-sidebar, .desertfox-help-drawer-open .desertfox-help-sidebar { transition: none; } }
</style>
</head>
<body><script src="help.js"></script>
<!-- moz-extension:// pages do not match <all_urls>, so keys on this page need the content script by tag. -->
<script src="content.js"></script>
<!-- Every other bundle loads on first use, as on a website: the background asks help.js to add its tag (src/shared/page_bundle_tag.ts), because executeScript is refused here. -->
</body>
</html>
