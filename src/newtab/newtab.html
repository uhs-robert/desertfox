<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New Tab</title>
<style>
  /* Declared only on this page, so no other page or script pulls the font. Until it loads, swap shows the digits in monospace. */
  @font-face { font-family: "DSEG7 Classic"; src: url("DSEG7Classic-Regular.ttf") format("truetype"); font-display: swap; }
  html { font-size: 14px; }
  html, body { margin: 0; height: 100%; }
  /* Colors are var() fallbacks, never declarations: a declaration here would shadow a theme or style.css value. */
  .oasisfox-newtab {
    position: relative;
    min-height: 100vh;
    background: var(--oasisfox-bg-core, #080d13);
    color: var(--oasisfox-fg-core, #b0c8de);
    font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.25;
  }
  .oasisfox-newtab .slot-middle-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
  .oasisfox-newtab .time { margin: 1rem; font-size: 24px; text-align: center; font-variant-numeric: tabular-nums; }
  .oasisfox-newtab .clock { display: block; width: 100%; max-width: 10em; margin: 0 auto; }
  .oasisfox-newtab .clock .bezel { fill: transparent; stroke: var(--oasisfox-primary, #1670ad); stroke-width: 2; }
  .oasisfox-newtab .clock line { transform-origin: 50px 50px; transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
  .oasisfox-newtab .clock.jumping line { transition: none; }
  .oasisfox-newtab .clock .hour, .oasisfox-newtab .clock .minute { stroke: var(--oasisfox-fg-core, #b0c8de); }
  .oasisfox-newtab .clock .second { stroke: var(--oasisfox-accent, #f0e68c); }
  .oasisfox-newtab .clock .cap { fill: var(--oasisfox-bg-mantle, #1a2330); }
  .oasisfox-newtab .date { margin: 0; font-size: 1.5em; font-weight: 500; color: var(--oasisfox-primary, #85a8cc); }
  .oasisfox-newtab .digital-clock { display: inline-flex; align-items: baseline; gap: 0.5rem; padding: 0.5rem 1rem; border-radius: 8px; background: var(--oasisfox-bg-mantle, #001400); color: var(--oasisfox-primary, #4af05c); }
  .oasisfox-newtab .digital-clock .digits { font-family: "DSEG7 Classic", monospace; font-size: 3.5em; }
  .oasisfox-newtab .digital-clock .meridiem { font-size: 0.75em; }
  .oasisfox-newtab .clock + .date, .oasisfox-newtab .digital-clock + .date { margin-top: 1rem; padding-top: 1rem; border-top: 2px solid var(--oasisfox-border, #4e6578); }
</style>
</head>
<body>
<!-- The page script comes first so a redirect starts before the key scripts load. -->
<script src="newtab.js"></script>
<!-- moz-extension:// pages do not match <all_urls>, and executeScript cannot reach them, so every key script loads by tag.
     content.js comes first because it creates the host that the others register with. -->
<script src="content.js"></script>
<script src="ui.js"></script>
<script src="hints.js"></script>
<script src="whichkey.js"></script>
<script src="cmdline.js"></script>
</body>
</html>
