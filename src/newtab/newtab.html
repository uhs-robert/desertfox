<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New Tab</title>
<link rel="icon" type="image/svg+xml" href="icons/desertfox.svg">
<!-- First, so the theme sheet and style.css that main.ts appends win over it. -->
<link rel="stylesheet" href="page_base.css">
<style>
  /* Declared only on this page, so no other page or script pulls the font. Until it loads, swap shows the digits in monospace. */
  @font-face { font-family: "DSEG7 Classic"; src: url("DSEG7Classic-Regular.ttf") format("truetype"); font-display: swap; }
  html { background: var(--desertfox-bg-core); }
  html, body { margin: 0; height: 100%; }
  /* The body is the column: the page fills it, and the nav under the page keeps the bottom, so nothing overlaps at any height. */
  body { display: flex; flex-direction: column; }
  .desertfox-newtab {
    position: relative;
    background: var(--desertfox-bg-core);
    color: var(--desertfox-fg-core);
    font: var(--desertfox-font);
    line-height: 1.25;
  }
  /* One column: the clock area takes the room above the lists and centers the clock in it, and the lists shrink to a scroll area, so they never cover the clock. The page scrolls when both cannot fit. */
  .desertfox-newtab { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; overflow-y: auto; }
  .desertfox-newtab .time-area { flex: 1 0 auto; display: flex; align-items: center; justify-content: center; }
  .desertfox-newtab .time { margin: 1rem; font-size: 24px; text-align: center; font-variant-numeric: tabular-nums; }
  .desertfox-newtab .clock { display: block; width: 100%; max-width: 10em; margin: 0 auto; }
  .desertfox-newtab .clock .bezel { fill: transparent; stroke: var(--desertfox-primary); stroke-width: 2; }
  .desertfox-newtab .clock line { transform-origin: 50px 50px; transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
  .desertfox-newtab .clock.jumping line { transition: none; }
  .desertfox-newtab .clock .hour, .desertfox-newtab .clock .minute { stroke: var(--desertfox-fg-core); }
  .desertfox-newtab .clock .second { stroke: var(--desertfox-secondary); }
  .desertfox-newtab .clock .cap { fill: var(--desertfox-bg-mantle); }
  .desertfox-newtab .date { margin: 0; font-size: 1.5em; font-weight: 500; color: var(--desertfox-primary); }
  .desertfox-newtab .digital-clock { display: inline-flex; align-items: baseline; gap: 0.5rem; padding: 0.5rem 1rem; border-radius: 8px; background: var(--desertfox-bg-mantle); color: var(--desertfox-primary); }
  .desertfox-newtab .digital-clock .digits { font-family: "DSEG7 Classic", monospace; font-size: min(84px, 22vw); }
  .desertfox-newtab .digital-clock .meridiem { font-size: 0.75em; }
  .desertfox-newtab .clock + .date, .desertfox-newtab .digital-clock + .date { margin-top: 1rem; padding-top: 1rem; border-top: 2px solid var(--desertfox-border); }
  .desertfox-newtab .lists { flex: 0 1 auto; min-height: 6rem; overflow-y: auto; display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 1rem 3rem; padding: 0 1.5rem; }
  /* With no clock the lists are the first child and sit at the bottom. */
  .desertfox-newtab .lists:first-child { margin-top: auto; }
  .desertfox-newtab .lists h4 { margin: 0 0 0.25rem; color: var(--desertfox-primary); font-weight: 500; }
  /* Two 14rem columns, one when the window is narrow. A grid fills row by row, so the DOM order is the visual order. */
  .desertfox-newtab .lists section { max-width: 100%; }
  .desertfox-newtab .tiles { display: grid; grid-template-columns: repeat(2, 14rem); gap: 0.5rem; }
  @media (max-width: 32rem) { .desertfox-newtab .tiles { grid-template-columns: minmax(0, 14rem); } }
  .desertfox-newtab .tile { flex-direction: row; align-items: center; gap: 0.75rem; box-sizing: border-box; height: 3.5rem; padding: 0 0.75rem; text-decoration: none; min-width: 0; }
  .desertfox-newtab .tile:focus-visible { outline: 2px solid var(--desertfox-primary); outline-offset: 2px; }
  .desertfox-newtab .tile-icon { flex: none; width: 1.75rem; height: 1.75rem; border-radius: 6px; object-fit: contain; }
  .desertfox-newtab .tile-letter { display: flex; align-items: center; justify-content: center; font-weight: 600; color: var(--desertfox-fg-core); background: color-mix(in srgb, var(--desertfox-primary) 35%, var(--desertfox-bg-mantle)); }
  .desertfox-newtab .tile-text { display: flex; flex-direction: column; min-width: 0; }
  .desertfox-newtab .tile-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .desertfox-newtab .tile-site { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--desertfox-text-small); color: color-mix(in srgb, var(--desertfox-fg-core) 65%, transparent); }
  /* The top-right corner of the page, right-aligned and out of the centered column. The settings gear sits in the opposite corner, so nothing is covered. */
  .desertfox-newtab .weather { position: absolute; top: 1rem; right: 1.25rem; z-index: 1; display: flex; flex-direction: column; align-items: flex-end; gap: 0.5rem; text-align: right; }
  .desertfox-newtab .weather-reading { display: flex; flex-direction: column; align-items: flex-end; gap: 0.5rem; }
  .desertfox-newtab .weather-main { display: flex; align-items: center; gap: 0.5rem; color: var(--desertfox-fg-core); font-size: 2rem; line-height: 1; }
  .desertfox-newtab .weather-icon { width: 2rem; height: 2rem; fill: none; stroke: var(--desertfox-secondary); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .desertfox-newtab .weather-stat { display: flex; flex-direction: column; align-items: flex-end; }
  .desertfox-newtab .weather-value { font-weight: 600; color: var(--desertfox-primary); }
  .desertfox-newtab .weather-label { font-size: var(--desertfox-text-small); color: color-mix(in srgb, var(--desertfox-fg-core) 65%, transparent); }
  .desertfox-newtab .weather-ask { padding: 0.25rem 0.5rem; background: none; border: 1px solid transparent; border-radius: 6px; font: inherit; font-size: var(--desertfox-text-small); color: color-mix(in srgb, var(--desertfox-fg-core) 65%, transparent); cursor: pointer; }
  /* Directly under the date, small and muted. */
  .desertfox-newtab .ip-info { margin-top: 0.5rem; text-align: center; min-height: 1.25rem; font-size: var(--desertfox-text-small); color: color-mix(in srgb, var(--desertfox-fg-core) 65%, transparent); }
  .desertfox-newtab .weather-ask:hover, .desertfox-newtab .weather-ask:focus-visible { border-color: var(--desertfox-border); outline: none; }
  .desertfox-newtab .weather-more { align-self: flex-end; padding: 0.25rem 0.5rem; background: none; border: 1px solid transparent; border-radius: 6px; font: inherit; font-size: var(--desertfox-text-small); color: var(--desertfox-primary); cursor: pointer; }
  .desertfox-newtab .weather-more:hover, .desertfox-newtab .weather-more:focus-visible { border-color: var(--desertfox-border); outline: none; }
  /* In place under the button, so it needs no focus trap. Its own scroll keeps a short window from losing the lists under it. */
  .desertfox-newtab .weather-detail { box-sizing: border-box; max-width: min(22rem, calc(100vw - 2.5rem)); max-height: 60vh; overflow: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 0.5rem; padding: 0.5rem 0.75rem; background: var(--desertfox-bg-mantle); border: 1px solid var(--desertfox-border); border-radius: 8px; }
  .desertfox-newtab .weather-detail[hidden] { display: none; }
  .desertfox-newtab .weather-facts { display: flex; gap: 1rem; }
  /* One row, never wrapped or scrolled: `hours_that_fit` in weather_detail.ts sizes it from these widths, so change them together. The columns shrink, so six still fit a window as narrow as about 256 px. */
  .desertfox-newtab .weather-hours { display: flex; flex-wrap: nowrap; justify-content: flex-end; gap: 0.25rem; max-width: 100%; }
  .desertfox-newtab .weather-hour { flex: 0 1 2.5rem; min-width: 0; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; text-align: center; white-space: nowrap; }
  .desertfox-newtab .weather-hour .weather-icon { width: 1.25rem; height: 1.25rem; margin: 0.125rem 0; }
  .desertfox-newtab .weather-hour .weather-label:empty::before { content: "\00a0"; }
  /* After the `.weather` rule, which has the same specificity. Below 32rem the card takes its own row above the clock. Up to 61rem it does so only while the 22rem detail is open, because the open panel would otherwise reach the centered clock and the closed card does not. */
  @media (max-width: 32rem) { .desertfox-newtab .weather { position: static; order: -1; align-self: flex-end; margin: 1rem 1.25rem 0; } }
  @media (max-width: 61rem) { .desertfox-newtab .weather:has(.weather-detail:not([hidden])) { position: static; order: -1; align-self: flex-end; margin: 1rem 1.25rem 0; } }
  .desertfox-newtab .command-hint { flex: none; align-self: center; margin: 0.75rem 0 0; padding: 0.25rem 0.5rem; background: none; border: 1px solid transparent; border-radius: 6px; font: inherit; font-size: var(--desertfox-text-small); color: color-mix(in srgb, var(--desertfox-fg-core) 65%, transparent); cursor: pointer; }
  .desertfox-newtab .command-hint:hover, .desertfox-newtab .command-hint:focus-visible { border-color: var(--desertfox-border); outline: none; }
  .desertfox-newtab .command-hint kbd { padding: 0 0.4em; border: 1px solid var(--desertfox-border); border-radius: 4px; background: var(--desertfox-bg-mantle); font: inherit; }
  /* The top-left corner, mirroring the weather card. Fixed, so it stays out of the column and the page redraw never touches it. */
  .settings-gear { position: fixed; top: 1rem; left: 1.25rem; z-index: 2; display: flex; padding: 0.25rem; border-radius: 6px; color: var(--desertfox-primary); }
  .settings-gear svg { width: 1.1rem; height: 1.1rem; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .settings-gear:hover, .settings-gear:focus-visible { outline: 1px solid var(--desertfox-border); }
  /* After the script-drawn page in the body column, so it has its own background. */
  .builtin-links { flex: none; padding: 0.75rem 0 1.5rem; background: var(--desertfox-bg-core); display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem 1.5rem; }
  .builtin-links a { color: var(--desertfox-primary); text-decoration: none; padding: 0.25rem 0.5rem; border-bottom: 1px solid transparent; }
  .builtin-links a:hover, .builtin-links a:focus-visible { border-bottom-color: var(--desertfox-border); color: var(--desertfox-primary); outline: none; }
</style>
</head>
<body>
<!-- The one place the built-in link targets live. Plain anchors, so hints reach them with no extra code. -->
<nav class="builtin-links">
  <a href="home.html#/quick-start">Getting Started</a>
  <a href="home.html">Help</a>
</nav>
<!-- The Settings page of the Home document, as the Settings text link was. A plain anchor, so a hint reaches it. -->
<a class="settings-gear" href="home.html#/settings" aria-label="Settings" title="Settings">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
</a>
<!-- The page script comes first so a redirect starts before the key scripts load. -->
<script src="newtab.js"></script>
<!-- moz-extension:// pages do not match <all_urls>, so content.js loads by tag. Every other bundle loads on first use: the background asks newtab.js to add its tag (src/shared/page_bundle_tag.ts). -->
<script src="content.js"></script>
</body>
</html>
