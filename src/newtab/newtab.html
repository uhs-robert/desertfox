<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New Tab</title>
<style>
  html, body { margin: 0; height: 100%; }
  /* The defaults sit on an inner element, like every OasisFox surface. */
  .oasisfox-newtab {
    --oasisfox-bg: #0c0e13;
    --oasisfox-fg: #f5f5dc;
    --oasisfox-accent: #7fa3c9;
    min-height: 100vh;
    background: var(--oasisfox-bg);
    color: var(--oasisfox-fg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    font: 16px/1.4 system-ui, sans-serif;
  }
  .oasisfox-newtab p { margin: 0; }
  .oasisfox-newtab .clock { width: min(40vh, 320px); height: min(40vh, 320px); }
  .oasisfox-newtab .date { font-size: 1.25rem; }
  .oasisfox-newtab .ip, .oasisfox-newtab .weather { opacity: 0.75; }
</style>
</head>
<body>
<!-- The page script comes first so a redirect starts before the key scripts load. -->
<script src="newtab.js"></script>
<!-- moz-extension:// pages do not match <all_urls>, and executeScript cannot reach them, so every key script loads by tag.
     content.js comes first because it creates the host that the others register with. -->
<script src="content.js"></script>
<script src="ui.js"></script>
<script src="hints.js"></script>
<script src="whichkey.js"></script>
<script src="cmdline.js"></script>
</body>
</html>
