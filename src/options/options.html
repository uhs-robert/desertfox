<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DesertFox status</title>
<style>
  html { background: var(--desertfox-bg-core, #0c0e13); color-scheme: dark light; }
  body { margin: 0; }
  /* The defaults sit on an inner element, like every DesertFox surface. */
  .desertfox-options {
    --desertfox-bg-core: #0c0e13;
    --desertfox-fg-core: #f5f5dc;
    --desertfox-primary: #7fa3c9;
    --desertfox-font: 15px/1.5 system-ui, sans-serif;
    --desertfox-radius: 6px;
    min-height: 100vh;
    box-sizing: border-box;
    padding: 1rem 2rem 4rem;
    background: var(--desertfox-bg-core);
    color: var(--desertfox-fg-core);
    font: var(--desertfox-font);
  }
  .desertfox-options-page { max-width: 60rem; }
  .desertfox-options h1, .desertfox-options h2 { color: var(--desertfox-primary); }
  .desertfox-options h3 { margin: 0 0 .25rem; }
  .desertfox-options-command {
    margin: 1rem 0;
    padding: .75rem 1rem;
    border: 1px solid color-mix(in srgb, var(--desertfox-fg-core) 25%, transparent);
    border-radius: var(--desertfox-radius);
  }
  .desertfox-options-usage, .desertfox-options kbd, .desertfox-options code {
    font-family: ui-monospace, monospace;
  }
  .desertfox-options-usage { margin: .25rem 0; }
  .desertfox-options kbd { color: var(--desertfox-primary); }
  .desertfox-options-mode { display: inline-block; min-width: 4.5rem; margin-right: .5rem; opacity: .6; }
  .desertfox-options-muted { opacity: .6; }
  .desertfox-options-warnings { color: var(--desertfox-primary); }
  .desertfox-options table { border-collapse: collapse; margin: .5rem 0; }
  .desertfox-options th, .desertfox-options td { padding: .1rem 1rem .1rem 0; text-align: left; vertical-align: top; }
</style>
</head>
<body><script src="options.js"></script></body>
</html>
