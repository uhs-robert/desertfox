# Sample search engines for OasisFox. "%s" stands for the query.
# Copy this file to ~/.config/oasisfox/search_engines.toml and edit it.
# OasisFox has one built-in engine, duck. An entry named duck here replaces it.

arch = { url = "https://wiki.archlinux.org/index.php?search=%s", label = "Arch Linux wiki" }
amazon = { url = "https://www.amazon.com/s?k=%s", label = "Amazon" }
brave = { url = "https://search.brave.com/search?q=%s", label = "Brave Search" }
gpt = { url = "https://chatgpt.com/?q=%s", label = "ChatGPT" }
commons = { url = "https://openverse.org/search/?q=%s", label = "Creative Commons search" }
crates = { url = "https://crates.io/search?q=%s", label = "Rust crates" }
duck = { url = "https://duckduckgo.com/?q=%s", label = "DuckDuckGo" }
define = { url = "https://www.merriam-webster.com/dictionary/%s", label = "Merriam-Webster dictionary" }
sitedown = { url = "https://www.isitdownrightnow.com/%s", label = "Is it down right now" }
fedora = { url = "https://packages.fedoraproject.org/search?query=%s", label = "Fedora packages" }
flathub = { url = "https://flathub.org/apps/search?q=%s", label = "Flathub apps" }
google = { url = "https://www.google.com/search?q=%s", label = "Google" }
# Code search needs a GitHub login.
gh = { url = "https://github.com/search?q=%s&type=code", label = "GitHub code search" }
github = { url = "https://github.com/search?q=%s", label = "GitHub" }
greasyfork = { url = "https://greasyfork.org/en/scripts?q=%s", label = "Greasy Fork user scripts" }
image = { url = "https://www.google.com/search?tbm=isch&q=%s", label = "Google Images" }
lastyear = { url = "https://www.google.com/search?hl=en&tbo=1&tbs=qdr:y&q=%s", label = "Google, past year" }
lastmonth = { url = "https://www.google.com/search?hl=en&tbo=1&tbs=qdr:m&q=%s", label = "Google, past month" }
lastweek = { url = "https://www.google.com/search?hl=en&tbo=1&tbs=qdr:w&q=%s", label = "Google, past week" }
lastday = { url = "https://www.google.com/search?hl=en&tbo=1&tbs=qdr:d&q=%s", label = "Google, past day" }
lasthour = { url = "https://www.google.com/search?hl=en&tbo=1&tbs=qdr:h&q=%s", label = "Google, past hour" }
maps = { url = "https://www.google.com/maps/search/%s", label = "Google Maps" }
nexusmods = { url = "https://www.nexusmods.com/games?keyword=%s&sort=approved", label = "Nexus Mods" }
gamebanana = { url = "https://gamebanana.com/search?_sModelName=Game&_sOrder=best_match&_sSearchString=%s", label = "GameBanana" }
hackernews = { url = "https://hn.algolia.com/?q=%s", label = "Hacker News" }
imdb = { url = "https://www.imdb.com/find?s=all&q=%s", label = "IMDb" }
# Fixed to the en-US locale.
mdn = { url = "https://developer.mozilla.org/en-US/search?q=%s", label = "MDN Web Docs" }
npm = { url = "https://www.npmjs.com/search?q=%s", label = "npm packages" }
proton = { url = "https://www.protondb.com/search?q=%s", label = "ProtonDB" }
reddit = { url = "https://www.reddit.com/search/?q=%s", label = "Reddit" }
redditgoogle = { url = "https://www.google.com/search?q=site:reddit.com+%s", label = "Reddit, through Google" }
rubygems = { url = "https://rubygems.org/search?query=%s", label = "RubyGems" }
stackoverflow = { url = "https://stackoverflow.com/search?q=%s", label = "Stack Overflow" }
steam = { url = "https://store.steampowered.com/search?term=%s", label = "Steam store" }
synonym = { url = "https://www.thesaurus.com/browse/%s", label = "Thesaurus" }
# Fixed to translate into English (tl=en).
translate = { url = "https://translate.google.com/?sl=auto&tl=en&text=%s", label = "Google Translate" }
# Results can include adult content.
urbandictionary = { url = "https://www.urbandictionary.com/define.php?term=%s", label = "Urban Dictionary" }
wikipedia = { url = "https://en.wikipedia.org/w/index.php?search=%s", label = "Wikipedia" }
wolframalpha = { url = "https://www.wolframalpha.com/input?i=%s", label = "Wolfram Alpha" }
youtube = { url = "https://www.youtube.com/results?search_query=%s", label = "YouTube" }
